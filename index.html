<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rray timeline</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="site/timeline.css">
    <style>
      body {
        --bs-body-bg: #fff;
        --bs-body-color: #212529;
        --bs-link-color: #0d6efd;
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 16px;
        background: var(--bs-body-bg);
        color: var(--bs-body-color);
        font-family: system-ui, sans-serif;
      }

      body.quarto-dark {
        --bs-body-bg: #222;
        --bs-body-color: #dee2e6;
        --bs-link-color: #6ea8fe;
      }

      a {
        color: var(--bs-link-color);
      }
    </style>
  </head>
  <body>
    <div id="rray-timeline"></div>
    <script type="module">
      import { mount } from "./site/timeline.js";

      // Stands in for Quarto's light and dark toggle
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const sync = () => document.body.classList.toggle("quarto-dark", dark.matches);
      sync();
      dark.addEventListener("change", sync);

      mount("#rray-timeline", "./site/timeline.json");
    </script>
  </body>
</html>
